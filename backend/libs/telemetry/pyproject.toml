[project]
name = "telemetry"
version = "0.1.0"
description = "Span recording and JSON logs shared by the Runtime City services"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "redis[hiredis]>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
