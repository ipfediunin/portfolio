[project]
name = "messaging"
version = "0.1.0"
description = "RabbitMQ topology and confirmed publishing; Kafka topics, producer and consumers; notifications for the realtime hub"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.2",
    "aiokafka>=0.15.0",
    "contracts",
    "redis[hiredis]>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
