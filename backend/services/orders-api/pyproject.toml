[project]
name = "orders-api"
version = "0.1.0"
description = "Orders API: the live FastAPI service behind the Runtime City playground"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.2",
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "contracts",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "messaging",
    "pydantic-settings>=2.16.2",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "telemetry",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orders-api = "orders_api.main:run"
orders-api-migrate = "orders_api.migrate:run"
orders-api-relay = "orders_api.relay:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
messaging = { workspace = true }
telemetry = { workspace = true }
