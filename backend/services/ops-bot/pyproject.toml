[project]
name = "ops-bot"
version = "0.1.0"
description = "The owner's Telegram bot (Flask): status, dead letters and their replay, alerts"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "flask[async]>=3.1.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "messaging",
    "pydantic-settings>=2.16.2",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "telemetry",
]

[project.scripts]
ops-bot = "ops_bot.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
messaging = { workspace = true }
telemetry = { workspace = true }
