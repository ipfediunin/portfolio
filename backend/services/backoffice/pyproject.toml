[project]
name = "backoffice"
version = "0.1.0"
description = "Payments API and back office (Django): checkout behind a circuit breaker, signed idempotent webhooks, admin"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "django>=6.1.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "redis[hiredis]>=8.1.0",
    "telemetry",
    "whitenoise>=6.12.0",
]

[project.scripts]
backoffice = "backoffice.main:serve"
backoffice-manage = "backoffice.main:manage"
backoffice-migrate = "backoffice.main:migrate"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
telemetry = { workspace = true }
