[project]
name = "realtime-hub"
version = "0.1.0"
description = "Pushes a sandbox's notifications and finished traces to the page over WebSocket"
readme = "README.md"
authors = [
    { name = "mipls", email = "feduninmichail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "redis[hiredis]>=8.1.0",
    "telemetry",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.0",
]

[project.scripts]
realtime-hub = "realtime_hub.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
telemetry = { workspace = true }
