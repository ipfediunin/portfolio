# Local stack of the Runtime City backend: the edge proxy, Orders API (FastAPI), Payments API and
# back office (Django), order workers, the outbox relay, the realtime hub (WebSocket), the owner's
# Telegram bot (Flask), RabbitMQ, Kafka, the payment provider stub, PostgreSQL, Redis.
#   docker compose up -d --build                    everything; the API answers on http://127.0.0.1:8000
#   docker compose up -d postgres redis rabbitmq kafka   only the data stores and the brokers, for
#                                                   tests and for running services with `uv run`
# Ports are bound to 127.0.0.1 only. Copy .env.example to .env to change secrets.
# RabbitMQ management UI: http://127.0.0.1:15673 (user runtime).
# Django admin: http://127.0.0.1:8001/admin/ (create the owner: docker compose exec payments
# backoffice-manage createsuperuser).
name: runtime-city

x-database-url: &database-url postgresql+asyncpg://runtime:${POSTGRES_PASSWORD:-runtime-dev}@postgres:5432/runtime_city
x-amqp-url: &amqp-url amqp://runtime:${RABBITMQ_PASSWORD:-runtime-dev}@rabbitmq:5672/runtime_city
# The Orders API calls the Payments API's /internal/ endpoints with this token.
x-internal-token: &internal-token ${INTERNAL_TOKEN:-local-dev-internal-token}

x-orders-api-env: &orders-api-env
  ORDERS_API_DATABASE_URL: *database-url
  ORDERS_API_REDIS_URL: redis://redis:6379/0
  ORDERS_API_AMQP_URL: *amqp-url
  ORDERS_API_KAFKA_BOOTSTRAP: kafka:9092
  ORDERS_API_PAYMENTS_URL: http://payments:8001
  ORDERS_API_INTERNAL_TOKEN: *internal-token
  ORDERS_API_IP_HASH_SECRET: ${ORDERS_API_IP_HASH_SECRET:-local-dev-ip-hash-secret}
  ORDERS_API_CORS_ORIGINS: ${ORDERS_API_CORS_ORIGINS:-["http://localhost:3000"]}
  # Requests arrive through the edge proxy; its X-Forwarded-For carries the client address.
  ORDERS_API_FORWARDED_ALLOW_IPS: "*"

x-ops-bot-env: &ops-bot-env
  OPS_BOT_DATABASE_URL: *database-url
  OPS_BOT_REDIS_URL: redis://redis:6379/0
  OPS_BOT_AMQP_URL: *amqp-url
  OPS_BOT_KAFKA_BOOTSTRAP: kafka:9092
  # Unset here: the bot then only logs its alerts. Set them in .env (see .env.example).
  OPS_BOT_TELEGRAM_TOKEN: ${OPS_BOT_TELEGRAM_TOKEN:-}
  OPS_BOT_OWNER_IDS: ${OPS_BOT_OWNER_IDS:-[]}
  OPS_BOT_TRANSPORT: ${OPS_BOT_TRANSPORT:-polling}
  OPS_BOT_PUBLIC_URL: ${OPS_BOT_PUBLIC_URL:-}
  OPS_BOT_WEBHOOK_SECRET: ${OPS_BOT_WEBHOOK_SECRET:-}

x-backoffice-env: &backoffice-env
  BACKOFFICE_DATABASE_URL: postgresql://runtime:${POSTGRES_PASSWORD:-runtime-dev}@postgres:5432/runtime_city
  BACKOFFICE_REDIS_URL: redis://redis:6379/0
  BACKOFFICE_PROVIDER_URL: http://provider-stub:8100
  BACKOFFICE_INTERNAL_TOKEN: *internal-token
  BACKOFFICE_SECRET_KEY: ${BACKOFFICE_SECRET_KEY:-local-dev-backoffice-secret-key-change-me}
  BACKOFFICE_ALLOWED_HOSTS: payments,localhost,127.0.0.1
  BACKOFFICE_CORS_ORIGINS: ${BACKOFFICE_CORS_ORIGINS:-http://localhost:3000}
  # The admin is plain HTTP on 127.0.0.1 here; behind TLS in production the cookies are Secure.
  BACKOFFICE_INSECURE_COOKIES: "1"

# Application containers: no writable filesystem, no privilege escalation, restarted on failure.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runtime-dev}
      POSTGRES_DB: runtime_city
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d runtime_city"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Nothing is persisted: sandboxes, caches and traces live in memory and expire on their own.
    command: >-
      redis-server --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy volatile-ttl
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # The node name (rabbit@rabbitmq) names the data directory: it must stay the same.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: runtime
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-runtime-dev}
      RABBITMQ_DEFAULT_VHOST: runtime_city
    # Quorum queues keep jobs on disk (that is what makes "queued" survive a restart). Jobs hold
    # no personal data and expire with the sandbox after 30 minutes.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # Order events (orders.events). KRaft, a single node that is broker and controller at once.
  # The durable record of an event is the outbox row in PostgreSQL; Kafka keeps events for an
  # hour, and its log lives in the container (recreating it starts an empty log; the relay and
  # the consumers create the topic again). Inside the network: kafka:9092; tests: 127.0.0.1:9094.
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    environment:
      # A KRaft cluster id: 16 random bytes, base64url (kafka-storage.sh random-uuid).
      CLUSTER_ID: WyjAzx3WRsqHKkF_Qcy1Rw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (partitions are part of the design), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  orders-api-migrate:
    build:
      context: .
      args:
        SERVICE: orders-api
    image: runtime-city/orders-api:local
    command: ["orders-api-migrate"]
    environment: *orders-api-env
    depends_on:
      postgres:
        condition: service_healthy

  orders-api:
    <<: *hardened
    image: runtime-city/orders-api:local
    environment: *orders-api-env
    # No port on the host: the edge proxy is the entry point.
    depends_on:
      orders-api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # Two replicas compete for the same queues: a job goes to whichever is free.
  order-worker:
    <<: *hardened
    build:
      context: .
      args:
        SERVICE: order-worker
    image: runtime-city/order-worker:local
    environment:
      ORDER_WORKER_AMQP_URL: *amqp-url
      ORDER_WORKER_DATABASE_URL: *database-url
      ORDER_WORKER_REDIS_URL: redis://redis:6379/0
      ORDER_WORKER_PROVIDER_URL: http://provider-stub:8100
      ORDER_WORKER_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      orders-api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      provider-stub:
        condition: service_healthy
    # SIGTERM first: the worker stops taking jobs and finishes the running ones.
    stop_grace_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  # Publishes the events the Orders API wrote into orders.outbox to Kafka (same image).
  outbox-relay:
    <<: *hardened
    image: runtime-city/orders-api:local
    command: ["orders-api-relay"]
    environment: *orders-api-env
    depends_on:
      orders-api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # The city's Notifications building: the pages' WebSockets (through the edge at /ws). Each replica
  # hears every sandbox's notifications on Redis and pushes to the sockets it holds.
  realtime-hub:
    <<: *hardened
    build:
      context: .
      args:
        SERVICE: realtime-hub
    image: runtime-city/realtime-hub:local
    environment:
      REALTIME_HUB_REDIS_URL: redis://redis:6379/0
      # The same website origins the Orders API allows.
      REALTIME_HUB_ALLOWED_ORIGINS: ${ORDERS_API_CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 5s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # The owner's Telegram bot (Flask): Telegram's webhook at /telegram/webhook through the edge.
  ops-bot:
    <<: *hardened
    build:
      context: .
      args:
        SERVICE: ops-bot
    image: runtime-city/ops-bot:local
    environment: *ops-bot-env
    depends_on:
      orders-api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # The bot's checks and alerts every 30 s; with the polling transport also the owner's commands.
  ops-bot-run:
    <<: *hardened
    image: runtime-city/ops-bot:local
    command: ["ops-bot", "run"]
    environment: *ops-bot-env
    depends_on:
      ops-bot:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Stands in for the external payment provider; reachable only inside this network.
  provider-stub:
    <<: *hardened
    build:
      context: .
      args:
        SERVICE: provider-stub
    image: runtime-city/provider-stub:local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  payments-migrate:
    build:
      context: .
      args:
        SERVICE: backoffice
    image: runtime-city/backoffice:local
    command: ["backoffice-migrate"]
    environment: *backoffice-env
    depends_on:
      postgres:
        condition: service_healthy

  # The Payments API (the city's "Payments API · Django") and the owner's admin.
  payments:
    <<: *hardened
    image: runtime-city/backoffice:local
    environment: *backoffice-env
    ports:
      # The admin, for the owner only. The public reaches /webhooks/ through the edge.
      - "127.0.0.1:8001:8001"
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Deletes payments and webhook events of expired sandboxes, every minute.
  payments-sweeper:
    <<: *hardened
    image: runtime-city/backoffice:local
    command: ["backoffice-manage", "sweep_expired", "--every", "60"]
    environment: *backoffice-env
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

  # The public entry point: /webhooks/ to the Payments API, /ws to the realtime hub, /telegram/ to
  # the ops bot, the rest to the Orders API.
  edge:
    <<: *hardened
    image: caddy:2-alpine
    volumes:
      - ./infra/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp
      - /data
      - /config
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      orders-api:
        condition: service_healthy
      payments:
        condition: service_healthy
      realtime-hub:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  postgres-data:
  rabbitmq-data:
